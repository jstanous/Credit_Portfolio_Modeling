models:
  - name: eph_borrowers
    description: "{{ doc('model__eph_borrowers') }}"
    columns:
      - name: borrower_id
        data_type: number
        description: "{{ doc('column__borrower_id') }}"
        data_tests:
          - not_null
          - unique
      - name: borrower_type
        data_type: varchar
        description: "{{ doc('column__borrower_type') }}"
        data_tests:
          - not_null
      - name: borrower_state
        data_type: varchar
        description: "{{ doc('column__borrower_state') }}"
        data_tests:
          - not_null
      - name: borrower_credit_grade
        data_type: varchar
        description: "{{ doc('column__borrower_credit_grade') }}"
        data_tests:
          - not_null
      - name: borrower_credit_subgrade
        data_type: varchar
        description: "{{ doc('column__borrower_credit_subgrade') }}"
        data_tests:
          - not_null
      - name: borrower_last_credit_report_date
        data_type: date
        description: "{{ doc('column__borrower_last_credit_report_date') }}"
        data_tests:
          - not_null
      - name: borrower_annual_income
        data_type: number
        description: "{{ doc('column__borrower_annual_income') }}"
        data_tests:
          - not_null
      - name: borrower_debt_to_income
        data_type: number
        description: "{{ doc('column__borrower_debt_to_income') }}"
        data_tests:
          - not_null
      - name: borrower_total_accounts
        data_type: number
        description: "{{ doc('column__borrower_total_accounts') }}"
        data_tests:
          - not_null
      - name: borrower_employment_tenure
        data_type: varchar
        description: "{{ doc('column__borrower_employment_tenure') }}"
        data_tests:
          - not_null
      - name: borrower_employment_title
        data_type: varchar
        description: "{{ doc('column__borrower_employment_title') }}"
#        data_tests:
#          - not_null
      - name: borrower_residence_status
        data_type: varchar
        description: "{{ doc('column__borrower_residence_status') }}"
        data_tests:
          - not_null
      - name: borrower_verification_status
        data_type: varchar
        description: "{{ doc('column__borrower_verification_status') }}"
        data_tests:
          - not_null

