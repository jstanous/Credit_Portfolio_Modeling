sources:
  - name: credit_portfolio
    database: credit_portfolio
    schema: ref
    description: "{{ doc('source__credit_portfolio_ref') }}"
#    config:
#      freshness:
#        warn_after:
#          count: 1
#          period: day
#        error_after:
#          count: 2
#          period: day
#      loaded_at_field: _etl_loaded_at
    tables:
      - name: loan_purpose
        description: "{{ doc('table__loan_purpose') }}"
        columns:
          - name: loan_purpose
            data_type: varchar
            description: "{{ doc('column__loan_purpose') }}"
            data_tests:
              - unique
              - not_null
          - name: collateral_type
            data_type: varchar
            description: "{{ doc('column__collateral_type') }}"
            data_tests:
              - not_null
          - name: exposure_type
            data_type: varchar
            description: "{{ doc('column__exposure_type') }}"
            data_tests:
              - not_null
      - name: risk_segments
        description: "{{ doc('table__risk_segments') }}"
        columns:
          - name: credit_grade
            data_type: varchar
            description: "{{ doc('column__credit_grade') }}"
            data_tests:
              - not_null
          - name: risk_segment
            data_type: varchar
            description: "{{ doc('column__risk_segment') }}"
            data_tests:
              - not_null
      - name: regions
        description: "{{ doc('table__regions') }}"
        columns:
          - name: state_cd
            data_type: varchar
            description: "{{ doc('column__state_cd') }}"
            data_tests:
              - not_null
          - name: division
            data_type: varchar
            description: "{{ doc('column__division') }}"
            data_tests:
              - not_null
          - name: region
            data_type: varchar
            description: "{{ doc('column__region') }}"
            data_tests:
              - not_null
          - name: fed_district
            data_type: number
            description: "{{ doc('column__fed_district') }}"
            data_tests:
              - not_null
          - name: fed_district_name
            data_type: varchar
            description: "{{ doc('column__fed_district_name') }}"
            data_tests:
              - not_null
