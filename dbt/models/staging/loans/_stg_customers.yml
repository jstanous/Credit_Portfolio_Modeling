models:
  - name: stg_customers
    description: "{{ doc('model__stg_customers') }}"
    columns:
      - name: customer_id
        data_type: number
        description: "{{ doc('column__customer_id') }}"
        data_tests:
          - not_null
          - unique
      - name: customer_type
        data_type: varchar
        description: "{{ doc('column__customer_type') }}"
        data_tests:
          - not_null
      - name: customer_state
        data_type: varchar
        description: "{{ doc('column__customer_state') }}"
        data_tests:
          - not_null
      - name: customer_credit_grade
        data_type: varchar
        description: "{{ doc('column__customer_credit_grade') }}"
        data_tests:
          - not_null
      - name: customer_credit_subgrade
        data_type: varchar
        description: "{{ doc('column__customer_credit_subgrade') }}"
        data_tests:
          - not_null
      - name: customer_last_credit_report_date
        data_type: date
        description: "{{ doc('column__customer_last_credit_report_date') }}"
        data_tests:
          - not_null
      - name: customer_annual_income
        data_type: number
        description: "{{ doc('column__customer_annual_income') }}"
        data_tests:
          - not_null
      - name: customer_debt_to_income
        data_type: number
        description: "{{ doc('column__customer_debt_to_income') }}"
        data_tests:
          - not_null
      - name: customer_total_accounts
        data_type: number
        description: "{{ doc('column__customer_total_accounts') }}"
        data_tests:
          - not_null
      - name: customer_employment_tenure
        data_type: varchar
        description: "{{ doc('column__customer_employment_tenure') }}"
        data_tests:
          - not_null
      - name: customer_employment_title
        data_type: varchar
        description: "{{ doc('column__customer_employment_title') }}"
#        data_tests:
#          - not_null
      - name: customer_residence_status
        data_type: varchar
        description: "{{ doc('column__customer_residence_status') }}"
        data_tests:
          - not_null
      - name: customer_verification_status
        data_type: varchar
        description: "{{ doc('column__customer_verification_status') }}"
        data_tests:
          - not_null

